[project]
name = "retail-demand-forecasting"
version = "1.0.0"
description = "Production-ready SKU-level retail demand forecasting system"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Retail Demand Forecasting Team"},
]

dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "prophet>=1.1.5",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "mlflow>=2.10.0",
    "hydra-core>=1.3.2",
    "pyyaml>=6.0",
    "shap>=0.44.0",
    "seaborn>=0.13.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N803", "N806", "N802", "N815", "B023"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
