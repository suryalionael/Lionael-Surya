name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort
      - name: Run Ruff
        run: ruff check src/ tests/
      - name: Run Black check
        run: black --check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  pipeline:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Verify pipeline imports
        run: python -c "
          from src.data.ingestion import DataIngestion;
          from src.data.cleaning import DataCleaner;
          from src.data.validation import DataValidation;
          from src.features.engineering import FeatureEngineer;
          from src.evaluation.metrics import calculate_all_metrics;
          from src.evaluation.backtesting import WalkForwardValidator;
          from src.forecasting.naive_model import NaiveSeasonalForecaster;
          print('All imports successful')
        "
      - name: Generate config validation
        run: python -c "
          import yaml;
          with open('configs/default.yaml') as f:
              config = yaml.safe_load(f);
          assert 'data' in config;
          assert 'models' in config;
          assert 'evaluation' in config;
          print('Config validation passed')
        "
